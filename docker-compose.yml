services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ollama_docker

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /backend
    env_file:
      - .env
    volumes:
      - ./backend:/backend
    entrypoint: ["/backend/wait-for-db.sh"]
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py makemigrations categories &&
        python manage.py migrate &&
        python manage.py migrate categories
      "
    depends_on:
      - db
    networks:
      - ollama_docker

  backend:
    working_dir: /backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/backend
    ports:
      - "8000:8000"
    entrypoint: [ "/backend/wait-for-db.sh" ]
    command: python manage.py runserver 0.0.0.0:8000
    stdin_open: true
    tty: true
    depends_on:
      - migrate
    networks:
      - ollama_docker

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - ollama_docker

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /backend
    entrypoint: ["/backend/wait-for-db.sh"]
    command: celery -A backend worker --loglevel=info
    volumes:
      - ./backend:/backend
    env_file:
      - .env
    depends_on:
      - migrate
      - redis
    networks:
      - ollama_docker

  frontend:
    build:
      context: ./frontend
    command: npm run start
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - ollama_docker

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
    networks:
      - ollama_docker

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./backend/start-ollama.sh:/backend/start-ollama.sh:ro
    entrypoint: [ "/backend/start-ollama.sh" ]
    depends_on:
      - backend
    networks:
      - ollama_docker

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    networks:
      - ollama_docker

volumes:
  pgdata:
  ollama_data:

networks:
  ollama_docker: